<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>卫星地面站排程台</title>
<style>body{font:15px system-ui;max-width:1100px;margin:40px auto;background:#eef5f7;padding:0 20px;color:#102a43}section{background:white;padding:20px;border-radius:12px;margin:16px 0;box-shadow:0 2px 12px #0001}pre{background:#071827;color:#67e8f9;padding:16px;border-radius:8px;overflow:auto}input,button{font:inherit;padding:8px;margin:4px}button{background:#0369a1;color:white;border:0;border-radius:6px}.warn{color:#b45309}.ok{color:#15803d}</style>
<h1>卫星地面站调度台</h1><p>维护期登记后，已排和进行中任务转待复核并释放时段；值班员在下方改派。身份由 X-User-Id、X-Role 和租户头提供。</p>
<section>
  <input id="u" value="operator"><input id="r" value="operator"><button onclick="load()">刷新状态</button>
  <h3>登记维护期</h3>
  <input id="ms" placeholder="地面站 GS1"><input id="ma" placeholder="天线（留空=全站）">
  <input id="mst" placeholder="开始 2026-09-27T00:20:00Z" style="width:240px">
  <input id="met" placeholder="结束 2026-09-27T00:40:00Z" style="width:240px">
  <input id="mr" placeholder="原因"><button onclick="registerMaintenance()">登记并检查冲突</button>
  <h3>改派待复核任务</h3>
  <input id="oid" placeholder="原排程 id" style="width:90px"><input id="wid" placeholder="窗口 id" style="width:80px"><input id="an" placeholder="天线 A2" style="width:90px">
  <input id="ost" placeholder="新开始" style="width:210px"><input id="oet" placeholder="新结束" style="width:210px"><input id="orate" placeholder="速率" style="width:70px">
  <button onclick="reassign()">改派（重新校验全部规则）</button>
  <pre id="o"></pre>
</section>
<script>
async function api(path,method='GET',body){
  let x=await fetch(path,{method,headers:{'Content-Type':'application/json','X-User-Id':u.value,'X-Role':r.value},body:body?JSON.stringify(body):undefined});
  let d=await x.json(); if(!x.ok) throw new Error(d.error+': '+(d.message||'')+' '+(d.details?JSON.stringify(d.details):'')); return d;
}
function show(d){o.textContent=JSON.stringify(d,null,2)}
async function load(){try{
  let s=await api('/api/state');
  let review=s.schedules.filter(x=>x.status==='review');
  let text={待复核排程:review,维护期:(s.maintenance||[]).map(m=>({id:m.id,站:m.station_id,天线:m.antenna_id||'全站',时间:[m.starts_at,m.ends_at],待复核冲突:m.open_conflicts,冲突数:m.conflicts.length}))};
  show(text);
}catch(e){o.textContent=e.message}}
async function registerMaintenance(){try{
  let d=await api('/api/maintenance','POST',{station_id:ms.value,antenna_id:ma.value||null,starts_at:mst.value,ends_at:met.value,reason:mr.value});
  show(d); load();
}catch(e){o.textContent=e.message}}
async function reassign(){try{
  let d=await api('/api/schedules/'+oid.value+'/reassign','POST',{window_id:Number(wid.value),antenna_id:an.value,starts_at:ost.value,ends_at:oet.value,rate_mbps:Number(orate.value)});
  show(d); load();
}catch(e){o.textContent=e.message}}
load();
</script>
</html>
